name: Bug report
description: Something is wrong or a measurement looks incorrect
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: "What happened?", description: Include expected vs actual.}
    validations: {required: true}
  - type: input
    id: device
    attributes: {label: "Device & Android version", placeholder: "Samsung A54, Android 14 (API 34)"}
    validations: {required: true}
  - type: input
    id: network
    attributes: {label: "Operator & RAT", placeholder: "Digicel PNG, LTE B28 / NR NSA"}
  - type: input
    id: version
    attributes: {label: "App version"}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: "Steps to reproduce"}
  - type: textarea
    id: logs
    attributes: {label: "Logs / exported CSV excerpt", render: text}
