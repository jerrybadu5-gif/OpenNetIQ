name: Security scan
on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "41 2 * * *"
permissions:
  contents: read
  security-events: write
jobs:
  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # trivy-action 0.35.0 = fixed release after the 2026 tag-hijack (GHSA-69fq-xp46-6x23).
      # TODO: pin to the full commit SHA of 0.35.0.
      - name: Trivy filesystem scan (vulns, secrets, misconfig)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          version: v0.69.3
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with: {sarif_file: trivy-results.sarif, category: trivy-fs}
