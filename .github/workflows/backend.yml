name: Backend CI
on:
  push:
    branches: [main, develop]
    paths: ["backend/**", "database/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "database/**", ".github/workflows/backend.yml"]
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env: {POSTGRES_USER: opennetiq, POSTGRES_PASSWORD: opennetiq, POSTGRES_DB: opennetiq_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opennetiq" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://opennetiq:opennetiq@localhost:5432/opennetiq_test
    steps:
      - uses: actions/checkout@v4
      - name: Detect API project
        id: detect
        run: echo "present=$([ -f backend/api/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - if: steps.detect.outputs.present == 'true'
        working-directory: backend/api
        run: pip install -e ".[dev]"
      - name: Lint
        if: steps.detect.outputs.present == 'true'
        working-directory: backend/api
        run: ruff check . && ruff format --check . && mypy app
      - name: Pytest + coverage
        if: steps.detect.outputs.present == 'true'
        working-directory: backend/api
        run: pytest --cov=app --cov-report=xml --cov-fail-under=80
      - name: Docker build
        if: steps.detect.outputs.present == 'true'
        run: docker build -t opennetiq-api:ci backend/api
      - name: Skipped
        if: steps.detect.outputs.present != 'true'
        run: echo "backend/api/pyproject.toml not present yet — backend starts in Phase 2."
