# Tuned for bulk transfer to many concurrent clients (docs/features/test-server).
worker_processes auto;
worker_rlimit_nofile 65535;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Privacy by design: no client IPs logged unless SPEEDTEST_ACCESS_LOG=on.
    log_format speedtest '$time_iso8601 $remote_addr "$request" $status $body_bytes_sent $request_time';
    include /tmp/opennetiq/logging.conf;

    sendfile on;
    sendfile_max_chunk 2m;
    tcp_nopush on;
    tcp_nodelay on;
    gzip off;

    keepalive_timeout 30s;
    keepalive_requests 10000;
    client_body_buffer_size 512k;
    client_max_body_size 64m;
    client_body_timeout 30s;
    send_timeout 30s;

    include /tmp/opennetiq/http.conf;
    include /tmp/opennetiq/https*.conf;
}
